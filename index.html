<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131d"><title>Puff Tycoon — Mobile Life Sim</title>
<style>
:root{--bg:#10131d;--phone:#171d2a;--card:#202a3a;--line:#344154;--ink:#f3f6ff;--muted:#9ba9bd;--accent:#8ef0c5;--blue:#8ebaff;--red:#ff8495;--gold:#ffd27b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#263c4a,#10131d 60%);color:var(--ink);font:14px system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center}.phone{width:100%;max-width:430px;min-height:100vh;background:var(--phone);padding:env(safe-area-inset-top) 15px calc(88px + env(safe-area-inset-bottom));position:relative;box-shadow:0 0 50px #0008}.status{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:7px 4px 14px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:900}.day{font-size:12px;color:var(--muted)}h1{font-size:27px;letter-spacing:-1px;margin:4px 0 12px}.money{background:linear-gradient(120deg,#284a48,#253348);border:1px solid #41645f;border-radius:17px;padding:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.money small{color:#c0d8d6}.money strong{font-size:25px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{font-size:16px}.section{display:flex;justify-content:space-between;align-items:center;margin:17px 0 10px}.section h2{font-size:16px;margin:0}.hint{font-size:11px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}.story{border-color:#4b6a64;background:linear-gradient(120deg,#263d3b,#202a3a)}.story b{color:var(--accent)}.story p{margin:6px 0 0;color:#d1dedc;line-height:1.5}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.app{border:1px solid var(--line);background:#222d3d;border-radius:17px;padding:13px 5px;text-align:center;color:var(--ink);cursor:pointer;min-height:90px}.app:active{transform:scale(.97)}.ico{font-size:27px;display:block;margin-bottom:7px}.app span:last-child{font-size:12px;font-weight:700}.app small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.dock{position:fixed;bottom:0;width:min(100%,430px);padding:10px 15px calc(10px + env(safe-area-inset-bottom));background:#151c28ee;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:5}.dock button{background:none;border:0;color:var(--muted);font-size:11px;padding:7px 0}.dock button b{display:block;font-size:19px;margin-bottom:3px}.dock button.active{color:var(--accent)}button{font:inherit}.btn{background:var(--accent);color:#10221d;border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.btn.secondary{background:#35445a;color:var(--ink)}.btn:disabled{opacity:.35}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row .btn{flex:1}.small{font-size:12px;color:var(--muted);line-height:1.5}.list{display:grid;gap:8px}.contact{display:flex;gap:10px;align-items:center;padding:10px;background:#263244;border-radius:12px}.avatar{width:42px;height:42px;border-radius:14px;background:#3a4d61;display:grid;place-items:center;font-size:21px;flex-shrink:0}.contact .info{flex:1;min-width:0}.contact b{display:block}.contact small{color:var(--muted)}.contact button{background:#3b4b60;color:white;border:0;border-radius:8px;padding:8px;font-size:12px}.bar{height:7px;border-radius:9px;background:#3a4657;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:var(--accent)}.pill{font-size:11px;border-radius:20px;padding:5px 8px;background:#35445a;color:#cbd9ea}.warn{color:var(--gold)}.bad{color:var(--red)}.good{color:var(--accent)}.hidden{display:none!important}.screen{animation:fade .15s ease}@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}.back{background:none;border:0;color:var(--accent);padding:0 0 12px;font-weight:700}.field{width:100%;background:#131a26;border:1px solid var(--line);border-radius:9px;padding:10px;color:white;margin:6px 0 10px}.log{padding:0;list-style:none}.log li{border-bottom:1px solid var(--line);padding:9px 0;font-size:12px;color:#c5d0df}.mission{border-left:3px solid var(--gold)}.footer{text-align:center;color:#718096;font-size:10px;margin:18px 0}
</style></head><body><main class="phone"><div class="status"><span id="clock">09:41</span><span>●●● ▰ 100%</span></div><div id="app"></div><nav class="dock"><button data-screen="home" class="active"><b>⌂</b>Accueil</button><button data-screen="contacts"><b>♙</b>Contacts</button><button data-screen="apps"><b>▦</b>Applications</button><button data-screen="profile"><b>☻</b>Ma vie</button></nav></main>
<script>
const $=s=>document.querySelector(s), money=n=>'€'+Math.floor(n).toLocaleString('fr-FR');
const initial=()=>({day:1,cash:180,energy:75,health:80,mood:65,fun:45,rep:8,stock:5,price:12,pendingOrders:[],clients:[{id:1,name:'Lina',type:'Client fidèle',emoji:'👩',trust:30,need:2},{id:2,name:'Samir',type:'Client occasionnel',emoji:'🧑',trust:12,need:1}],relays:[{id:3,name:'Noé',type:'Relais débutant',emoji:'🤝',trust:20}],suppliers:[{id:4,name:'Dépôt Nova',type:'Fournisseur',emoji:'📦',trust:40,cost:6,deliveryDays:2,deliveryFee:5,maxOrder:5,unlockLevel:1,models:['Classique','Menthe']},{id:5,name:'Cloud Supply',type:'Fournisseur',emoji:'🚚',trust:65,cost:7,deliveryDays:1,deliveryFee:0,maxOrder:8,unlockLevel:1,models:['Classique','Menthe','Fruits rouges']},{id:6,name:'VapoTrade',type:'Fournisseur',emoji:'🏪',trust:52,cost:5,deliveryDays:3,deliveryFee:3,maxOrder:12,unlockLevel:3,models:['Classique','Menthe','Fruits rouges','Tropical']},{id:7,name:'Flash Wholesale',type:'Fournisseur',emoji:'⚡',trust:30,cost:4,deliveryDays:3,deliveryFee:8,maxOrder:15,unlockLevel:4,models:['Classique','Menthe','Fruits rouges','Tropical','Édition limitée']},{id:8,name:'Atlas Distribution',type:'Fournisseur',emoji:'🏬',trust:72,cost:8,deliveryDays:2,deliveryFee:0,maxOrder:25,unlockLevel:6,models:['Classique','Menthe','Fruits rouges','Tropical','Édition limitée','Collection premium']},{id:9,name:'Import Prestige',type:'Fournisseur',emoji:'✨',trust:80,cost:11,deliveryDays:1,deliveryFee:0,maxOrder:40,unlockLevel:9,models:['Classique','Menthe','Fruits rouges','Tropical','Édition limitée','Collection premium','Modèles exclusifs']}],rent:25,storage:12,actions:3,xp:0,level:1,sales:0,history:[],mission:null,event:null,unlocked:0});
let g;try{g=Object.assign(initial(),JSON.parse(localStorage.getItem('pt-phone-save'))||{})}catch{g=initial()}
const log=t=>{g.history.unshift('J'+g.day+' · '+t);g.history=g.history.slice(0,35)}, rand=a=>a[Math.floor(Math.random()*a.length)];
function xp(n){g.xp+=n;if(g.xp>=g.level*35){g.xp-=g.level*35;g.level++;g.rep=Math.min(100,g.rep+3);log('Niveau '+g.level+' débloqué : réputation +3.');}}
function act(energy=8,cost=0){if(g.actions<1||g.energy<energy||g.cash<cost){alert('Pas assez d’actions, d’énergie ou d’argent.');return false}g.actions--;g.energy-=energy;g.cash-=cost;return true}
function save(){localStorage.setItem('pt-phone-save',JSON.stringify(g))}
function button(label,fn,disabled=false,secondary=false){return '<button class="btn '+(secondary?'secondary':'')+'" '+(disabled?'disabled':'')+' data-action="'+fn+'">'+label+'</button>'}
function card(title,desc,action,disabled=false,secondary=false){return '<div class="card"><b>'+title+'</b><p class="small">'+desc+'</p>'+button(action.split('|')[0],action.split('|')[1],disabled,secondary)+'</div>'}
function home(){return '<div class="top"><span class="brand">PUFF TYCOON</span><span class="day">JOUR '+g.day+' · ANNÉE '+(1+Math.floor((g.day-1)/30))+'</span></div><h1>Salut, Alex 👋</h1><div class="money"><div><small>Solde disponible</small><br><strong>'+money(g.cash)+'</strong></div><span class="pill">Niv. '+g.level+'</span></div><div class="quick"><div class="metric"><small>Énergie</small><b>'+g.energy+'%</b><div class="bar"><i style="width:'+g.energy+'%"></i></div></div><div class="metric"><small>Réputation</small><b>'+g.rep+'/100</b><div class="bar"><i style="width:'+g.rep+'%"></i></div></div><div class="metric"><small>Stock</small><b>'+g.stock+' u.</b></div></div><div class="card story"><b>✦ TON OBJECTIF</b><p>Pars de zéro, construis une petite marque fictive, fidélise tes contacts et paie tes factures. Chaque journée coûte de l’argent : planifie tes actions.</p></div><div class="section"><h2>À faire aujourd’hui</h2><span class="hint">'+g.actions+' actions restantes</span></div><div class="card"><div class="row"><div><b>📣 Trouver des clients</b><p class="small">Prospection : contacts et réputation peuvent augmenter.</p></div>'+button('Faire','prospect',g.actions<1||g.energy<10,true)+'</div></div><div class="card"><div class="row"><div><b>🛍️ Vendre au comptoir</b><p class="small">La demande dépend du stock, des clients, du prix et de l’énergie.</p></div>'+button('Vendre','sell',g.actions<1||g.energy<12||g.stock<1)+'</div></div><div class="card"><div class="row"><div><b>🧾 Clôturer la journée</b><p class="small">Paye le loyer, perçois les commandes des relais et affronte un événement.</p></div>'+button('Terminer','end',false,true)+'</div></div><div class="section"><h2>Notification</h2></div><div class="card '+(g.event?'mission':'')+'"><b>'+(g.event?g.event.title:'Bienvenue dans ton téléphone')+'</b><p class="small">'+(g.event?g.event.text:'Tes contacts, tes finances et ton état personnel évoluent ensemble. Ouvre les applications pour gérer ton activité.')+'</p></div><div class="section"><h2>Applications récentes</h2></div>'+appsGrid()}</div>'}
function appsGrid(){return '<div class="apps">'+[['📇','Contacts','contacts'],['📦','Stock','stock'],['🏦','Banque','bank'],['🎯','Missions','missions'],['💬','Messages','messages'],['🧘','Bien-être','life'],['🏭','Fournisseurs','suppliers']].map(x=>'<button class="app" data-screen="'+x[2]+'"><span class="ico">'+x[0]+'</span><span>'+x[1]+'</span></button>').join('')+'</div>'}
function contacts(){let all=[...g.clients,...g.relays,...g.suppliers];return '<button class="back" data-screen="home">← Accueil</button><h1>Contacts</h1><p class="small">Les relations sont persistantes : confiance, commandes et réputation influencent les résultats.</p><div class="section"><h2>Clients · '+g.clients.length+'</h2></div>'+g.clients.map(c=>'<div class="contact"><div class="avatar">'+c.emoji+'</div><div class="info"><b>'+c.name+'</b><small>'+c.type+' · confiance '+c.trust+'/100 · besoin '+c.need+' u.</small><div class="bar"><i style="width:'+c.trust+'%"></i></div></div>'+button('Message','msg:'+c.id,false,true)+'</div>').join('')+'<div class="section"><h2>Relais · '+g.relays.length+'</h2></div>'+g.relays.map(c=>'<div class="contact"><div class="avatar">'+c.emoji+'</div><div class="info"><b>'+c.name+'</b><small>'+c.type+' · confiance '+c.trust+'/100</small></div>'+button('Détails','msg:'+c.id,false,true)+'</div>').join('')+'<div class="section"><h2>Fournisseurs</h2></div>'+g.suppliers.map(c=>'<div class="contact"><div class="avatar">'+c.emoji+'</div><div class="info"><b>'+c.name+'</b><small>'+c.type+' · coût '+money(c.cost)+'/unité · fiabilité '+c.trust+'%</small></div>'+button('Commander','supplier:'+c.id,false,true)+'</div>').join('')}
function apps(){return '<h1>Applications</h1><p class="small">Tout est relié à la même sauvegarde de partie.</p>'+appsGrid()+'<div class="section"><h2>Gestion rapide</h2></div>'+card('Passer une commande','Les fournisseurs déterminent le coût du stock et sa disponibilité.','Commander 5 unités|order')+card('Améliorer la réputation','Une bonne relation client rend la demande plus stable.','Faire du service client|service',g.actions<1)}
function stock(){return '<button class="back" data-screen="apps">← Applications</button><h1>Stock & ventes</h1><div class="card"><div class="row"><span>Inventaire fictif</span><b>'+g.stock+' / '+g.storage+' unités</b></div><div class="bar"><i style="width:'+Math.min(100,g.stock/g.storage*100)+'%"></i></div><p class="small">Prix actuel : '+money(g.price)+' · ventes cumulées : '+g.sales+'</p></div>'+card('Réapprovisionnement','Chaque unité coûte le tarif du fournisseur choisi.','Commander 5 unités|order',g.cash<30||g.stock+5>g.storage)+card('Ajuster le prix','Le prix plus élevé augmente la marge mais réduit la demande.','Changer le prix|price')+card('Vendre','La vente consomme une action et de l’énergie.','Tenir le comptoir|sell',g.stock<1||g.actions<1)}
function suppliers(){let available=g.suppliers.filter(s=>g.level>=s.unlockLevel),locked=g.suppliers.filter(s=>g.level<s.unlockLevel);return '<button class="back" data-screen="apps">← Applications</button><h1>Marché fournisseurs 🏭</h1><p class="small">En progressant, ta réputation commerciale et ton niveau ouvrent des fournisseurs plus spécialisés, de nouveaux modèles et des commandes plus importantes.</p>'+((g.pendingOrders||[]).length?'<div class="card"><b>🚚 Commandes en transit</b>'+g.pendingOrders.map(o=>'<p class="small">'+o.qty+' unités · '+o.model+' · '+o.supplier+' · arrivée dans '+o.daysLeft+' jour(s)</p>').join('')+'</div>':'')+'<div class="card"><b>Semaine '+(1+Math.floor((g.day-1)/7))+'</b><p class="small">Prochaine révision dans '+(7-((g.day-1)%7))+' jour(s). Les prix peuvent monter ou baisser.</p></div>'+available.map(s=>'<div class="contact"><div class="avatar">'+s.emoji+'</div><div class="info"><b>'+s.name+' · niv. '+s.unlockLevel+'</b><small>'+money(s.cost)+'/unité · '+s.deliveryDays+' j · livraison '+(s.deliveryFee?money(s.deliveryFee):'gratuite')+' · lot max '+s.maxOrder+' · confiance '+s.trust+'%'+(s.trust>=80?' · remise fidélité 10%':'')+'<br>Modèles : '+s.models.join(', ')+'</small></div>'+button('Commander '+s.maxOrder,'buyfrom:'+s.id,false,true)+'</div>').join('')+(locked.length?'<div class="section"><h2>Fournisseurs à débloquer</h2></div>'+locked.map(s=>'<div class="contact"><div class="avatar">🔒</div><div class="info"><b>'+s.name+'</b><small>Débloqué au niveau '+s.unlockLevel+' · lot max '+s.maxOrder+' · '+s.models.length+' modèles</small></div></div>').join(''):'')+'<p class="small">Les modèles sont fictifs. Chaque commande contient le lot maximal du fournisseur; le stock est crédité à la livraison.</p>'}\nfunction bank(){return '<button class="back" data-screen="apps">← Applications</button><h1>Banque 🏦</h1><div class="money"><div><small>Solde</small><br><strong>'+money(g.cash)+'</strong></div></div><div class="card"><b>Charges quotidiennes</b><p class="small">Loyer '+money(g.rent)+' par jour. Si ton solde devient négatif, la réputation et la santé financière chutent.</p></div><div class="card"><b>Mini-prêt de départ</b><p class="small">Emprunte 100 € maintenant, rembourse 125 € à la prochaine clôture. Une seule fois.</p>'+button('Emprunter 100 €','loan',g.unlocked>0)+'</div>'}
function missions(){return '<button class="back" data-screen="apps">← Applications</button><h1>Missions 🎯</h1><div class="card mission"><b>'+(g.mission?g.mission.title:'Mission du jour')+'</b><p class="small">'+(g.mission?g.mission.text:'Une mission apparaîtra au prochain début de journée.')+'</p><p class="small">Récompense : '+(g.mission?money(g.mission.reward):'—')+'</p></div>'+card('Objectif permanent','Atteins 100 unités vendues pour débloquer un nouvel espace de stockage. Progression : '+g.sales+'/100.','Voir progression|noop',true,true)}
function messages(){return '<button class="back" data-screen="contacts">← Contacts</button><h1>Messages 💬</h1><div class="list">'+[...g.clients,...g.relays,...g.suppliers].map(c=>'<div class="contact"><div class="avatar">'+c.emoji+'</div><div class="info"><b>'+c.name+'</b><small>'+(c.last||'Aucun nouveau message')+'</small></div>'+button('Ouvrir','msg:'+c.id,false,true)+'</div>').join('')+'</div>'}
function life(){return '<button class="back" data-screen="home">← Accueil</button><h1>Ma vie ☻</h1><div class="card"><b>État personnel</b><p class="small">Santé '+g.health+'% · Humeur '+g.mood+'% · Loisirs '+g.fun+'%</p>'+[['Santé',g.health],['Humeur',g.mood],['Loisirs',g.fun]].map(x=>'<div class="small">'+x[0]+'<div class="bar"><i style="width:'+x[1]+'%"></i></div></div>').join('')+'</div>'+card('Dormir','Récupère de l’énergie et de la santé.','sleep',g.actions<1)+card('Sortir avec des amis','Coûte 20 €, améliore l’humeur et le réseau.','friends',g.actions<1||g.cash<20)+card('Prendre soin de soi','Coûte 12 €, augmente santé et humeur.','selfcare',g.actions<1||g.cash<12)}
function render(screen='home'){let routes={home,contacts,apps,stock,bank,missions,messages,life,suppliers,profile:life};$('#app').innerHTML='<div class="screen">'+(routes[screen]||home)()+'</div>';document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));save()}
function find(id){return [...g.clients,...g.relays,...g.suppliers].find(x=>x.id===Number(id))}
function action(a){if(a==='prospect'){if(!act(10))return;let c={id:Date.now(),name:rand(['Maya','Eden','Léo','Inès','Nino','Zoé']),type:'Nouveau client',emoji:'🙂',trust:rand([8,12,18]),need:1};g.clients.push(c);g.rep=Math.min(100,g.rep+1);xp(8);log('Prospection : '+c.name+' rejoint tes contacts.');render('home')}
else if(a==='sell'){if(!act(12))return;let demand=1+Math.floor(g.clients.reduce((n,c)=>n+c.trust/35+c.need*.35,0)+g.relays.length*.8+g.rep/30+Math.random()*2-g.price/13);let qty=Math.max(0,Math.min(g.stock,Math.floor(demand)));let revenue=qty*g.price;g.stock-=qty;g.cash+=revenue;g.sales+=qty;g.clients.forEach(c=>{if(qty>0)c.trust=Math.min(100,c.trust+2)});g.rep=Math.min(100,g.rep+(qty?1:0));xp(qty*2+3);log(qty+' unités vendues, recette '+money(revenue)+'.');alert(qty+' unités vendues · '+money(revenue)+' de chiffre d’affaires.');render('home')}
else if(a==='end'){let fee=g.rent+(g.debt||0);g.cash-=fee;g.debt=0;let relays=g.relays.length;let payout=relays*4;g.cash+=payout;g.energy=Math.min(100,g.energy+18);g.mood=Math.max(0,g.mood-4);g.day++;g.actions=3;g.pendingOrders=g.pendingOrders||[];g.pendingOrders.forEach(o=>o.daysLeft--);let arrived=g.pendingOrders.filter(o=>o.daysLeft<=0);arrived.forEach(o=>{g.stock+=o.qty;log('Livraison reçue : '+o.qty+' unités de '+o.supplier+'.')});g.pendingOrders=g.pendingOrders.filter(o=>o.daysLeft>0);if((g.day-1)%7===0){g.suppliers.forEach(s=>{let old=s.cost,change=rand([-2,-1,1,2]);s.cost=Math.max(3,Math.min(12,s.cost+change));});log('Révision hebdomadaire des tarifs fournisseurs : '+g.suppliers.map(s=>s.name+' '+money(s.cost)+'/u.').join(', ')+'.');}let events=[['Panne de téléphone','−15 € de frais imprévus.',-15],['Client mécontent','Un client perd confiance : réputation −3.',0],['Bon bouche-à-oreille','Réputation +4 et un nouveau client potentiel.',0],['Fournisseur en retard','Aucun réapprovisionnement possible aujourd’hui.',0],['Journée tranquille','Tu récupères 8 énergie.',0],['Contrôle qualité fictif','La qualité de ton stock est questionnée : réputation −5.',0]];let ev=rand(events);g.event={title:ev[0],text:ev[1]};g.cash+=ev[2];if(ev[0]==='Client mécontent'&&g.clients.length)g.clients[0].trust=Math.max(0,g.clients[0].trust-20);if(ev[0]==='Bon bouche-à-oreille'){g.rep=Math.min(100,g.rep+4);g.clients.push({id:Date.now(),name:rand(['Lou','Milo','Aya']),type:'Client recommandé',emoji:'🙂',trust:18,need:1})}if(ev[0]==='Journée tranquille')g.energy=Math.min(100,g.energy+8);if(g.cash<0){g.rep=Math.max(0,g.rep-5);g.health=Math.max(0,g.health-5)}if(g.mission){if(g.mission.kind==='sales'&&g.sales>=g.mission.target){g.cash+=g.mission.reward;g.rep=Math.min(100,g.rep+4);log('Mission accomplie : '+money(g.mission.reward)+' reçus.')}else if(g.day>g.mission.deadline){g.rep=Math.max(0,g.rep-4);log('Mission échouée : réputation −4.')}g.mission=null}let kinds=[{title:'Commande urgente',text:'Vends au moins 4 unités avant la prochaine clôture.',kind:'sales',target:g.sales+4,reward:55},{title:'Réseau à développer',text:'Ajoute un relais via une rencontre professionnelle.',kind:'relay',target:1,reward:70},{title:'Semaine rentable',text:'Garde un solde positif après les charges.',kind:'cash',target:1,reward:45}];g.mission=rand(kinds);g.mission.deadline=g.day+1;log('Charges '+money(fee)+' · revenus des relais '+money(payout)+' · événement : '+ev[0]+'.');render('home')}
else if(a==='order'){render('suppliers')}\nelse if(a.startsWith('buyfrom:')){let supplier=g.suppliers.find(x=>x.id===Number(a.split(':')[1]));if(!supplier||g.level<supplier.unlockLevel){alert('Ce fournisseur n’est pas encore débloqué.');return}let q=supplier.maxOrder,model=rand(supplier.models),discount=supplier.trust>=80?0.10:0,subtotal=Math.round(q*supplier.cost*(1-discount)),fee=supplier.deliveryFee,total=subtotal+fee;if(g.cash<total||g.stock+q>g.storage){alert('Fonds ou capacité de stockage insuffisants pour ce lot de '+q+' unités (livraison comprise).');return}if(!act(4,total))return;g.pendingOrders=g.pendingOrders||[];g.pendingOrders.push({id:Date.now(),supplier:supplier.name,qty:q,model,daysLeft:supplier.deliveryDays});supplier.trust=Math.min(100,supplier.trust+8);log('Commande passée chez '+supplier.name+' : '+q+' unités ('+model+'), '+supplier.deliveryDays+' jour(s) de délai, livraison '+money(fee)+(discount?' et remise fidélité de 10%':'')+'. Total '+money(total)+'.');render('suppliers')}
else if(a==='price'){let p=prompt('Nouveau prix fictif (6 à 25 €) :',g.price);if(p===null)return;p=Number(p);if(!Number.isFinite(p)||p<6||p>25){alert('Prix invalide.');return}g.price=p;log('Prix ajusté à '+money(p)+'.');render('stock')}
else if(a==='service'){if(!act(8))return;g.clients.forEach(c=>c.trust=Math.min(100,c.trust+8));g.rep=Math.min(100,g.rep+2);xp(7);log('Service client : confiance améliorée.');render('apps')}
else if(a==='loan'){g.cash+=100;g.unlocked++;g.debt=125;log('Prêt de 100 € contracté. Remboursement 125 € à la prochaine clôture.');render('bank')}
else if(a==='sleep'){if(!act(0))return;g.energy=Math.min(100,g.energy+35);g.health=Math.min(100,g.health+10);g.mood=Math.min(100,g.mood+8);render('life')}
else if(a==='friends'){if(!act(8,20))return;g.mood=Math.min(100,g.mood+18);g.fun=Math.min(100,g.fun+15);g.relays[0].trust=Math.min(100,g.relays[0].trust+5);render('life')}
else if(a==='selfcare'){if(!act(5,12))return;g.health=Math.min(100,g.health+15);g.mood=Math.min(100,g.mood+10);render('life')}
else if(a.startsWith('msg:')){let c=find(a.split(':')[1]);if(c){let msg=c.type.includes('Fournisseur')?'Le tarif actuel est de '+money(c.cost)+' par unité.':c.type.includes('Relais')?'Je peux apporter des commandes si tu maintiens la confiance.':'Je reviendrai si la qualité et le service restent bons.';alert(c.name+' : « '+msg+' »');c.last=msg;render('messages')}}
else if(a.startsWith('supplier:')){render('suppliers')}
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-screen]');if(b){render(b.dataset.screen);return}let a=e.target.closest('[data-action]');if(a&&!a.disabled)action(a.dataset.action)});
