<script>
const $=s=>document.querySelector(s), money=n=>'€'+Math.floor(n).toLocaleString('fr-FR');
const initial=()=>({day:1,cash:180,energy:75,health:80,mood:65,fun:45,rep:8,stock:5,price:12,pendingOrders:[],clients:[{id:1,name:'Lina',type:'Client fidèle',emoji:'👩',trust:30,need:2},{id:2,name:'Samir',type:'Client occasionnel',emoji:'🧑',trust:12,need:1}],relays:[{id:3,name:'Noé',type:'Relais débutant',emoji:'🤝',trust:20}],suppliers:[{id:4,name:'Dépôt Nova',type:'Fournisseur',emoji:'📦',trust:40,cost:6,deliveryDays:2,deliveryFee:5,maxOrder:10,unlockLevel:1,models:['Classique','Menthe']},{id:5,name:'Cloud Supply',type:'Fournisseur',emoji:'🚚',trust:65,cost:7,deliveryDays:1,deliveryFee:0,maxOrder:15,unlockLevel:1,models:['Classique','Menthe','Fruits rouges']},{id:6,name:'VapoTrade',type:'Fournisseur',emoji:'🏪',trust:52,cost:5,deliveryDays:3,deliveryFee:3,maxOrder:25,unlockLevel:3,models:['Classique','Menthe','Fruits rouges','Tropical']},{id:7,name:'Flash Wholesale',type:'Fournisseur',emoji:'⚡',trust:30,cost:4,deliveryDays:3,deliveryFee:8,maxOrder:40,unlockLevel:4,models:['Classique','Menthe','Fruits rouges','Tropical','Édition limitée']},{id:8,name:'Atlas Distribution',type:'Fournisseur',emoji:'🏬',trust:72,cost:8,deliveryDays:2,deliveryFee:0,maxOrder:75,unlockLevel:6,models:['Classique','Menthe','Fruits rouges','Tropical','Édition limitée','Collection premium']},{id:9,name:'Import Prestige',type:'Fournisseur',emoji:'✨',trust:80,cost:11,deliveryDays:1,deliveryFee:0,maxOrder:100,unlockLevel:9,models:['Classique','Menthe','Fruits rouges','Tropical','Édition limitée','Collection premium','Modèles exclusifs']}],rent:25,storage:12,actions:3,xp:0,level:1,sales:0,history:[],mission:null,event:null,unlocked:0});
let g;try{g=Object.assign(initial(),JSON.parse(localStorage.getItem('pt-phone-save'))||{})}catch{g=initial()}g.chatLog=g.chatLog||{};g.appointments=g.appointments||[];g.minuteOfDay=g.minuteOfDay||0;g.storage=Math.max(g.storage||12,12+g.level*12);g.actions=999;
const log=t=>{g.history.unshift('J'+g.day+' · '+t);g.history=g.history.slice(0,35)}, rand=a=>a[Math.floor(Math.random()*a.length)];
function xp(n){g.xp+=n;if(g.xp>=g.level*35){g.xp-=g.level*35;g.level++;g.storage=Math.max(g.storage,12+g.level*12);log('Niveau '+g.level+' débloqué : capacité de stockage '+g.storage+' unités.');}}
function act(energy=8,cost=0){if(g.energy<energy||g.cash<cost){alert('Pas assez d’énergie ou d’argent.');return false}g.energy-=energy;g.cash-=cost;return true}
function save(){try{localStorage.setItem('pt-phone-save',JSON.stringify(g))}catch(e){console.warn('Sauvegarde indisponible',e)}}
function button(label,fn,disabled=false,secondary=false){return '<button class="btn '+(secondary?'secondary':'')+'" '+(disabled?'disabled':'')+' data-action="'+fn+'">'+label+'</button>'}
function card(title,desc,action,disabled=false,secondary=false){return '<div class="card"><b>'+title+'</b><p class="small">'+desc+'</p>'+button(action.split('|')[0],action.split('|')[1],disabled,secondary)+'</div>'}
function gameClock(){let m=g.minuteOfDay||0;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function home(){return '<div class="top"><span class="brand">PUFF MOBILE · SIMULATOR</span><span class="day">JOUR '+g.day+' · NIV. '+g.level+'</span></div><div class="clock-card"><div><small>Heure du jeu · temps réel</small><div class="clock-time">'+gameClock()+'</div><small>2 secondes réelles = 1 minute au rythme ×1</small><div class="speed-controls">'+[[0,'Ⅱ Pause'],[1,'×1'],[2,'×2'],[4,'×4'],[5,'×5']].map(v=>'<button class="'+((g.timeSpeed===undefined?1:g.timeSpeed)===v[0]?'selected':'')+'" data-action="speed:'+v[0]+'">'+v[1]+'</button>').join('')+'</div></div><span class="pill">'+((g.timeSpeed||1)===0?'Ⅱ En pause':'● ×'+(g.timeSpeed||1))+'</span></div><h1>Salut, Alex 👋</h1><div class="money"><div><small>Solde disponible</small><br><strong>'+money(g.cash)+'</strong><div class="small" style="color:#b7d9e7;margin-top:5px">↑ Progression · '+g.xp+' XP</div></div><span class="pill">Niv. '+g.level+'</span></div><div class="quick"><div class="metric"><small>⚡ Énergie</small><b>'+g.energy+'%</b><div class="bar"><i style="width:'+g.energy+'%"></i></div></div><div class="metric"><small>✦ Réputation</small><b>'+g.rep+'/100</b><div class="bar"><i style="width:'+g.rep+'%"></i></div></div><div class="metric"><small>▣ Stock</small><b>'+g.stock+' u.</b><div class="bar"><i style="width:'+Math.min(100,g.stock/g.storage*100)+'%"></i></div></div></div><div class="section"><h2>Applications</h2><span class="hint">Ton téléphone</span></div>'+appsGrid()+'<div class="section"><h2>Ta journée</h2><span class="hint">'+g.actions+' actions disponibles</span></div><div class="card story"><b>✦ '+(g.event?g.event.title:'Objectif du jour')+'</b><p>'+(g.event?g.event.text:'Développe ton réseau, gère ton stock et garde un œil sur tes finances.')+'</p></div><div class="card"><b>📅 Rendez-vous à venir</b><p class="small">Les échanges et commandes se concluent à l’heure prévue.</p>'+((g.appointments||[]).length?g.appointments.map(a=>'<div class="appointment"><b>Jour '+a.day+' · '+String(Math.floor(a.minute/60)).padStart(2,'0')+':'+String(a.minute%60).padStart(2,'0')+'</b><div class="small">'+(find(a.clientId)?.name||'Contact')+' · rendez-vous client</div></div>').join(''):'<p class="small">Aucun rendez-vous prévu. Ouvre une discussion pour en proposer un.</p>')+'</div></div>'}
function appsGrid(){return '<div class="apps">'+[['💬','Messages','messages'],['👥','Contacts','contacts'],['🏭','Fournisseurs','suppliers'],['📦','Stock','stock'],['📈','Ventes','stock'],['🏦','Banque','bank'],['🎯','Missions','missions'],['☻','Ma vie','life']].map(x=>'<button class="app" data-screen="'+x[2]+'"><span class="ico">'+x[0]+'</span><span>'+x[1]+'</span></button>').join('')+'</div>'}
function contacts(){let groups=[['Clients',g.clients],['Relais',g.relays],['Fournisseurs',g.suppliers.filter(p=>g.level>=p.unlockLevel)]];return '<button class="back" data-screen="home">← Accueil</button><h1>Contacts</h1><p class="small">Ouvre un profil pour discuter et choisir une interaction adaptée à son rôle.</p>'+groups.map(([label,arr])=>'<div class="section"><h2>'+label+' · '+arr.length+'</h2></div>'+arr.map(p=>'<div class="contact" data-action="openchat:'+p.id+'"><div class="avatar">'+p.emoji+'</div><div class="info"><b>'+p.name+'</b><small>'+p.type+' · confiance '+p.trust+'/100</small><div class="bar"><i style="width:'+p.trust+'%"></i></div></div><span class="tag">Discuter ›</span></div>').join('')).join('')}
function apps(){return '<button class="back" data-screen="home">← Accueil</button><h1>Applications</h1><p class="small">Tout est relié à la même sauvegarde de partie.</p>'+appsGrid()+'<div class="section"><h2>Gestion rapide</h2></div>'+card('Passer une commande','Les fournisseurs déterminent le coût du stock et sa disponibilité.','Commander 5 unités|order')+card('Améliorer la réputation','Une bonne relation client rend la demande plus stable.','Améliorer le moral|service',g.actions<1)}
function stock(){return '<button class="back" data-screen="apps">← Applications</button><h1>Stock & ventes</h1><div class="card"><div class="row"><span>Inventaire fictif</span><b>'+g.stock+' / '+g.storage+' unités</b></div><div class="bar"><i style="width:'+Math.min(100,g.stock/g.storage*100)+'%"></i></div><p class="small">Prix actuel : '+money(g.price)+' · ventes cumulées : '+g.sales+'</p></div>'+card('Réapprovisionnement','Chaque unité coûte le tarif du fournisseur choisi.','Commander 5 unités|order',g.cash<30||g.stock+5>g.storage)+card('Ajuster le prix','Le prix plus élevé augmente la marge mais réduit la demande.','Changer le prix|price')+card('Vendre','La vente consomme une action et de l’énergie.','Tenir le comptoir|sell',g.stock<1||g.actions<1)}
function suppliers(){let available=g.suppliers.filter(s=>g.level>=s.unlockLevel),locked=g.suppliers.filter(s=>g.level<s.unlockLevel);return '<button class="back" data-screen="apps">← Applications</button><h1>Marché fournisseurs 🏭</h1><p class="small">En progressant, ta réputation commerciale et ton niveau ouvrent des fournisseurs plus spécialisés, de nouveaux modèles et des commandes plus importantes.</p>'+((g.pendingOrders||[]).length?'<div class="card"><b>🚚 Commandes en transit</b>'+g.pendingOrders.map(o=>'<p class="small">'+o.qty+' unités · '+o.model+' · '+o.supplier+' · arrivée dans '+o.daysLeft+' jour(s)</p>').join('')+'</div>':'')+'<div class="card"><b>Semaine '+(1+Math.floor((g.day-1)/7))+'</b><p class="small">Prochaine révision dans '+(7-((g.day-1)%7))+' jour(s). Les prix peuvent monter ou baisser.</p></div>'+available.map(s=>'<div class="contact"><div class="avatar">'+s.emoji+'</div><div class="info"><b>'+s.name+' · niv. '+s.unlockLevel+'</b><small>'+money(s.cost)+'/unité · '+s.deliveryDays+' j · livraison '+(s.deliveryFee?money(s.deliveryFee):'gratuite')+' · lot max '+s.maxOrder+' · confiance '+s.trust+'%'+(s.trust>=80?' · remise fidélité 10%':'')+'<br>Modèles : '+s.models.join(', ')+'</small></div>'+button('Commander '+s.maxOrder,'buyfrom:'+s.id,false,true)+'</div>').join('')+(locked.length?'<div class="section"><h2>Fournisseurs à débloquer</h2></div>'+locked.map(s=>'<div class="contact"><div class="avatar">🔒</div><div class="info"><b>'+s.name+'</b><small>Débloqué au niveau '+s.unlockLevel+' · lot max '+s.maxOrder+' · '+s.models.length+' modèles</small></div></div>').join(''):'')+'<p class="small">Les modèles sont fictifs. Chaque commande contient le lot maximal du fournisseur; le stock est crédité à la livraison.</p>'}
function bank(){return '<button class="back" data-screen="apps">← Applications</button><h1>Banque 🏦</h1><div class="money"><div><small>Solde</small><br><strong>'+money(g.cash)+'</strong></div></div><div class="card"><b>Charges quotidiennes</b><p class="small">Loyer '+money(g.rent)+' par jour. Si ton solde devient négatif, la réputation et la santé financière chutent.</p></div><div class="card"><b>Mini-prêt de départ</b><p class="small">Emprunte 100 € maintenant, rembourse 125 € à la prochaine clôture. Une seule fois.</p>'+button('Emprunter 100 €','loan',g.unlocked>0)+'</div>'}

function chatInteractions(p){if(p.type.includes('Fournisseur'))return [['Voir les tarifs','tarifs'],['Négocier la relation','negocier'],['Suivre une livraison','livraison'],['Voir les modèles','modeles']];if(p.type.includes('Relais'))return [['Proposer une collaboration','collab'],['Parler de la commission','commission'],['Demander un bilan','bilan'],['Renforcer le lien','lien']];let a=[['Prendre des nouvelles','nouvelles'],['Connaître le prix et le stock','prix'],['Proposer une offre fidélité','offre'],['Demander un avis','avis']];if(p.trust>=90&&!p.seller)a.push(['Lui proposer de vendre pour nous','recruit']);return a}
function answerFor(p,key){if(key==='recruit')return 'Avec plaisir ! Je peux proposer tes produits à mes contacts. Ma commission personnelle est de '+(p.commissionRate||12)+' % sur chaque vente.';if(p.type.includes('Fournisseur')){if(key==='tarifs')return 'Mon tarif actuel est de '+money(p.cost)+' par unité, avec '+(p.deliveryFee?money(p.deliveryFee)+' de frais de livraison':'livraison gratuite')+'. Le délai annoncé est de '+p.deliveryDays+' jour(s).'+(p.trust>=80?' Tu bénéficies de ta remise fidélité de 10 %.':'');if(key==='negocier')return p.trust>=80?'Notre relation est excellente. Tu as déjà accès à la remise fidélité de 10 %.':'On peut renforcer notre relation avec des commandes régulières. Ma confiance actuelle est de '+p.trust+' %. La remise fidélité de 10 % commence à 80 %.';if(key==='livraison'){let orders=(g.pendingOrders||[]).filter(o=>o.supplier===p.name);return orders.length?'J’ai '+orders.length+' commande(s) en transit : '+orders.map(o=>o.qty+' unités, arrivée dans '+o.daysLeft+' jour(s)').join(' ; ')+'.':'Aucune commande en transit. Mon délai habituel est de '+p.deliveryDays+' jour(s).';}return 'Modèles fictifs : '+p.models.join(', ')+'. Lot maximal : '+p.maxOrder+' unités.';}if(p.type.includes('Relais')){if(key==='collab')return 'Avec plaisir ! Le revenu actuel est de '+money(4)+' par jour à la clôture. Ta confiance est de '+p.trust+' %. Développons notre partenariat !';if(key==='commission')return 'Le système prévoit '+money(4)+' par relais et par journée clôturée. Tu peux suivre les revenus du réseau dans Banque.';if(key==='bilan')return 'Bilan : confiance '+p.trust+'/100, niveau joueur '+g.level+', réputation '+g.rep+'/100.';return p.trust>=70?'Merci, notre relation est déjà solide. Continuons !':'Merci ! Ta confiance actuelle est de '+p.trust+'/100.';}if(key==='prix')return 'Le prix affiché est de '+money(g.price)+' par unité. Ton besoin estimé est de '+p.need+' unité(s), stock disponible : '+g.stock+'/'+g.storage+'.';if(key==='offre')return p.trust>=60?'Merci pour cette attention, je reviendrai bientôt !':'Merci ! Les échanges réguliers renforceront notre fidélité. Confiance : '+p.trust+'/100.';if(key==='avis')return 'Mon avis actuel : '+(p.trust>=70?'positif':'encore prudent')+'. Confiance '+p.trust+'/100, prix '+money(g.price)+', stock '+g.stock+' unité(s).';return 'Ça va, merci ! Le prix actuel est de '+money(g.price)+' et ma demande estimée est de '+p.need+' unité(s).';}
function chat(p){if(!p)return '<button class="back" data-screen="messages">← Messages</button><h1>Conversation introuvable</h1>';let hist=chatFor(p),opts=chatInteractions(p),pending=(g.appointments||[]).find(a=>a.clientId===p.id);return '<button class="back" data-screen="messages">← Messages</button><div class="chat-head"><div class="avatar">'+p.emoji+'</div><div style="flex:1"><b style="font-size:17px">'+p.name+'</b><div class="small">'+p.type+' · relation '+p.trust+'/100'+(p.seller?' · partenaire vendeur ('+p.commissionRate+' %)':'')+'</div></div><span class="tag">En ligne</span></div><div class="chat-bubbles">'+hist.map(m=>'<div class="bubble '+(m.from==='me'?'mine':'theirs')+'">'+m.text+'<time>Jour '+(m.day||g.day)+'</time></div>').join('')+'</div>'+(p.pendingRequest?'<div class="card"><b>Demande de '+p.name+'</b><p class="small">Commande : '+p.pendingRequest.qty+' unité(s) · rendez-vous proposé à '+String(Math.floor(p.pendingRequest.minute/60)).padStart(2,'0')+':'+String(p.pendingRequest.minute%60).padStart(2,'0')+'</p>'+button('Confirmer le rendez-vous','acceptrequest:'+p.id,false,true)+'</div>':'')+(pending?'<div class="card"><b>Rendez-vous confirmé</b><p class="small">Jour '+pending.day+' à '+String(Math.floor(pending.minute/60)).padStart(2,'0')+':'+String(pending.minute%60).padStart(2,'0')+'</p></div>':'')+'<div class="section"><h2>Interactions</h2><span class="hint">Selon son rôle et votre relation</span></div><div class="chat-actions">'+opts.map((o,i)=>button(o[0],'chatact:'+p.id+':'+i,false,true)).join('')+'</div><div class="chat-compose"><input id="chat-input" placeholder="Écrire un message…" maxlength="160"><button data-action="sendchat:'+p.id+'">Envoyer</button></div>'}

function processAppointment(ap){let p=find(ap.clientId);if(!p)return;let qty=Math.min(g.stock,Math.max(1,Math.floor(ap.qty||1)));if(qty<=0){log('Rendez-vous manqué avec '+p.name+' : stock insuffisant.');return}let unitPrice=ap.unitPrice||g.price,revenue=qty*unitPrice;g.stock-=qty;g.cash+=revenue;g.sales+=qty;p.completedOrders=(p.completedOrders||0)+1;p.trust=Math.min(100,p.trust+2+Math.min(3,Math.floor(qty/3)));if(p.completedOrders%5===0)p.orderStage=Math.min(5,(p.orderStage||0)+1);let nextQty=1+(p.orderStage||0);p.need=nextQty;g.rep=Math.min(100,g.rep+0.05);xp(1);let h=chatFor(p);h.push({from:'them',text:'Merci pour la commande ! Je confirme '+qty+' unité(s), soit '+money(revenue)+(unitPrice<g.price?' après la remise de '+Math.round((1-unitPrice/g.price)*100)+' %':'')+'. Notre relation progresse à '+p.trust+'/100. Avec le temps, je pourrai commander un peu plus la prochaine fois (actuellement '+nextQty+' unité(s)).',day:g.day});p.last='Commande conclue : '+qty+' unité(s)';log('Rendez-vous terminé avec '+p.name+' : '+qty+' unité(s), '+money(revenue)+'.');}
function gameTick(){let speed=g.timeSpeed===undefined?1:g.timeSpeed;if(speed<=0)return;for(let step=0;step<speed;step++)gameMinute();}function gameMinute(){g.minuteOfDay=(g.minuteOfDay||0)+1;if(g.minuteOfDay>=1440){g.minuteOfDay=0;g.day++;g.cash-=g.rent;g.energy=Math.min(100,g.energy+10);g.pendingOrders=(g.pendingOrders||[]).map(o=>({...o,daysLeft:o.daysLeft-1}));let arrived=g.pendingOrders.filter(o=>o.daysLeft<=0);arrived.forEach(o=>{g.stock=Math.min(g.storage,g.stock+o.qty);log('Livraison reçue : '+o.qty+' unités de '+o.supplier+'.')});g.pendingOrders=g.pendingOrders.filter(o=>o.daysLeft>0);log('Nouvelle journée. Charges : '+money(g.rent)+'.');}
let now=(g.day-1)*1440+g.minuteOfDay;let due=(g.appointments||[]).filter(a=>a.absolute<=now);g.appointments=(g.appointments||[]).filter(a=>a.absolute>now);due.forEach(processAppointment);if(g.minuteOfDay%360===0){g.clients.filter(p=>p.seller).forEach(p=>{if(g.stock>0&&Math.random()<0.45){let qty=Math.min(g.stock,Math.max(1,Math.min(p.need||1,1+(p.orderStage||0))));let gross=qty*g.price,commission=Math.round(gross*(p.commissionRate||12)/100);g.stock-=qty;g.cash+=gross-commission;g.sales+=qty;p.totalCommission=(p.totalCommission||0)+commission;let msg='J’ai vendu '+qty+' unité(s) pour toi. Chiffre d’affaires : '+money(gross)+', ma commission ('+(p.commissionRate||12)+' %) : '+money(commission)+'.';chatFor(p).push({from:'them',text:msg,day:g.day});p.last='Vente par partenaire : '+qty+' unité(s), commission '+money(commission);log(p.name+' a vendu '+qty+' unité(s), commission '+money(commission)+'.');}})}g.clients.forEach(p=>{if(!p.pendingRequest&&!due.some(a=>a.clientId===p.id)&&Math.random()<0.00012){let offset=30+Math.floor(Math.random()*91),absolute=now+offset,minute=absolute%1440,day=Math.floor(absolute/1440)+1,baseQty=Math.max(1,p.need||1),bulk=p.trust>=80&&Math.random()<0.12,qty=bulk?baseQty*(2+Math.floor(Math.random()*3)):baseQty,discount=bulk?rand([5,8,10,12,15]):0,unitPrice=Math.round(g.price*(1-discount/100)*100)/100;p.pendingRequest={qty,absolute,minute,day,unitPrice,discount,bulk};let hh=String(Math.floor(minute/60)).padStart(2,'0'),mm=String(minute%60).padStart(2,'0');chatFor(p).push({from:'them',text:'Salut ! Est-ce que tu as '+qty+' puff(s) de disponible(s) ? '+(bulk?'Je te prends un lot plus important ; tu peux me faire '+discount+' % de réduction ? ':'')+'Je peux passer au rendez-vous à '+hh+' (Jour '+day+'). Dis-moi si tu confirmes !',day:g.day});p.last='Nouvelle demande : '+qty+' unité(s)'+(discount?' avec remise de '+discount+' %':'')+', rendez-vous proposé '+hh+'.';}});
if(g.clients.length<30){let chance=(g.rep*g.rep)*0.000001;if(Math.random()<chance){let c={id:Date.now()+Math.floor(Math.random()*999),name:rand(['Maya','Eden','Léo','Inès','Nino','Zoé','Lou','Milo','Aya']),type:'Nouveau client',emoji:'🙂',trust:8,need:1,orderStage:0,completedOrders:0,commissionRate:rand([8,10,12,15,18])};g.clients.push(c);log('Un nouveau client, '+c.name+', a découvert ton activité grâce à ta réputation.');}}

function render(screen='home'){let routes={home,contacts,apps,stock,bank,missions,messages,life,suppliers,chat:()=>chat(find(g.openChat)),profile:life};try{$('#app').innerHTML='<div class="screen">'+(routes[screen]||home)()+'</div>';save()}catch(e){console.error('Erreur affichage Puff Tycoon',e);$('#app').innerHTML='<div class="card" style="margin-top:24px"><h2>Erreur d’affichage</h2><p class="small" id="error-detail"></p><button class="btn" onclick="location.reload()">Recharger le jeu</button></div>';let d=$('#error-detail');if(d)d.textContent=e.message||String(e)}}

function action(a){if(a.startsWith('speed:')){g.timeSpeed=Number(a.split(':')[1]);save();render('home');return}if(a==='prospect'){if(!act(10))return;let c={id:Date.now(),name:rand(['Maya','Eden','Léo','Inès','Nino','Zoé']),type:'Nouveau client',emoji:'🙂',trust:rand([8,12,18]),need:1};g.clients.push(c);g.rep=Math.min(100,g.rep+1);xp(8);log('Prospection : '+c.name+' rejoint tes contacts.');render('home')}
else if(a==='sell'){if(!act(12))return;let demand=1+Math.floor(g.clients.reduce((n,c)=>n+c.trust/35+c.need*.35,0)+g.relays.length*.8+g.rep/30+Math.random()*2-g.price/13);let qty=Math.max(0,Math.min(g.stock,Math.floor(demand)));let revenue=qty*g.price;g.stock-=qty;g.cash+=revenue;g.sales+=qty;g.rep=Math.min(100,g.rep+(qty?1:0));xp(qty*2+3);log(qty+' unités vendues, recette '+money(revenue)+'.');alert(qty+' unités vendues · '+money(revenue)+' de chiffre d’affaires.');render('home')}
else if(a==='end'){let fee=g.rent+(g.debt||0);g.cash-=fee;g.debt=0;let relays=g.relays.length;let payout=relays*4;g.cash+=payout;g.energy=Math.min(100,g.energy+18);g.mood=Math.max(0,g.mood-4);g.day++;g.actions=3;g.pendingOrders=g.pendingOrders||[];g.pendingOrders.forEach(o=>o.daysLeft--);let arrived=g.pendingOrders.filter(o=>o.daysLeft<=0);arrived.forEach(o=>{g.stock=Math.min(g.storage,g.stock+o.qty);log('Livraison reçue : '+o.qty+' unités de '+o.supplier+'.')});g.pendingOrders=g.pendingOrders.filter(o=>o.daysLeft>0);if((g.day-1)%7===0){g.suppliers.forEach(s=>{let old=s.cost,change=rand([-2,-1,1,2]);s.cost=Math.max(3,Math.min(12,s.cost+change));});log('Révision hebdomadaire des tarifs fournisseurs : '+g.suppliers.map(s=>s.name+' '+money(s.cost)+'/u.').join(', ')+'.');}let events=[['Panne de téléphone','−15 € de frais imprévus.',-15],['Client mécontent','Un client perd confiance : réputation −3.',0],['Bon bouche-à-oreille','Réputation +4 et un nouveau client potentiel.',0],['Fournisseur en retard','Aucun réapprovisionnement possible aujourd’hui.',0],['Journée tranquille','Tu récupères 8 énergie.',0],['Contrôle qualité fictif','La qualité de ton stock est questionnée : réputation −5.',0]];let ev=rand(events);g.event={title:ev[0],text:ev[1]};g.cash+=ev[2];if(ev[0]==='Client mécontent'&&g.clients.length)g.clients[0].trust=Math.max(0,g.clients[0].trust-20);if(ev[0]==='Bon bouche-à-oreille'){g.rep=Math.min(100,g.rep+0.05)}if(ev[0]==='Journée tranquille')g.energy=Math.min(100,g.energy+8);if(g.cash<0){g.rep=Math.max(0,g.rep-5);g.health=Math.max(0,g.health-5)}if(g.mission){if(g.mission.kind==='sales'&&g.sales>=g.mission.target){g.cash+=g.mission.reward;log('Mission accomplie : '+money(g.mission.reward)+' reçus.')}else if(g.day>g.mission.deadline){log('Mission échouée : réputation −4.')}g.mission=null}let kinds=[{title:'Commande urgente',text:'Vends au moins 4 unités avant la prochaine clôture.',kind:'sales',target:g.sales+4,reward:55},{title:'Réseau à développer',text:'Ajoute un relais via une rencontre professionnelle.',kind:'relay',target:1,reward:70},{title:'Semaine rentable',text:'Garde un solde positif après les charges.',kind:'cash',target:1,reward:45}];g.mission=rand(kinds);g.mission.deadline=g.day+1;log('Charges '+money(fee)+' · revenus des relais '+money(payout)+' · événement : '+ev[0]+'.');render('home')}
else if(a==='order'){render('suppliers')}
else if(a.startsWith('buyfrom:')){let supplier=g.suppliers.find(x=>x.id===Number(a.split(':')[1]));if(!supplier||g.level<supplier.unlockLevel){alert('Ce fournisseur n’est pas encore débloqué.');return}let q=supplier.maxOrder,model=rand(supplier.models),discount=supplier.trust>=80?0.10:0,subtotal=Math.round(q*supplier.cost*(1-discount)),fee=supplier.deliveryFee,total=subtotal+fee;let alreadyOrdered=(g.pendingOrders||[]).reduce((n,o)=>n+o.qty,0);if(g.cash<total||g.stock+alreadyOrdered+q>g.storage){alert('Fonds ou capacité de stockage insuffisants pour ce lot de '+q+' unités (livraison comprise).');return}if(!act(4,total))return;g.pendingOrders=g.pendingOrders||[];g.pendingOrders.push({id:Date.now(),supplier:supplier.name,qty:q,model,daysLeft:supplier.deliveryDays});supplier.trust=Math.min(100,supplier.trust+8);log('Commande passée chez '+supplier.name+' : '+q+' unités ('+model+'), '+supplier.deliveryDays+' jour(s) de délai, livraison '+money(fee)+(discount?' et remise fidélité de 10%':'')+'. Total '+money(total)+'.');render('suppliers')}
else if(a==='price'){let p=prompt('Nouveau prix fictif (6 à 25 €) :',g.price);if(p===null)return;p=Number(p);if(!Number.isFinite(p)||p<6||p>25){alert('Prix invalide.');return}g.price=p;log('Prix ajusté à '+money(p)+'.');render('stock')}

else if(a.startsWith('openchat:')){let p=find(a.split(':')[1]);if(p){g.openChat=p.id;chatFor(p);render('chat')}}
else if(a.startsWith('acceptrequest:')){let p=find(a.split(':')[1]);if(p&&p.pendingRequest){let q=p.pendingRequest;g.appointments=g.appointments||[];g.appointments.push({clientId:p.id,day:q.day,minute:q.minute,absolute:q.absolute,qty:q.qty,unitPrice:q.unitPrice,discount:q.discount});p.pendingRequest=null;let hh=String(Math.floor(q.minute/60)).padStart(2,'0'),mm=String(q.minute%60).padStart(2,'0');chatFor(p).push({from:'me',text:'Je confirme le rendez-vous à '+hh+ ' (Jour '+q.day+').',day:g.day},{from:'them',text:'Parfait, à tout à l’heure !',day:g.day});p.last='Rendez-vous confirmé : '+hh;save();render('chat')}}
else if(a.startsWith('chatact:')){let parts=a.split(':'),p=find(parts[1]),i=Number(parts[2]);if(p&&(!p.type.includes('Fournisseur')||g.level>=p.unlockLevel)){let opts=chatInteractions(p),chosen=opts[i];if(chosen){let h=chatFor(p),reply=answerFor(p,chosen[1]);h.push({from:'me',text:chosen[0],day:g.day},{from:'them',text:reply,day:g.day});p.last=reply;if(chosen[1]==='recruit'&&p.trust>=90){p.seller=true;p.commissionRate=p.commissionRate||rand([8,10,12,15,18]);reply='Marché conclu ! Je deviens ton partenaire vendeur. Ma commission sera de '+p.commissionRate+' % sur chaque vente réalisée pour toi.';h[h.length-1].text=reply;p.last='Partenaire vendeur · commission '+p.commissionRate+' %';log(p.name+' devient partenaire vendeur ('+p.commissionRate+' %).')}if(chosen[1]==='collab'){p.trust=Math.min(100,p.trust+5);g.rep=Math.min(100,g.rep+1);log('Collaboration discutée avec '+p.name+'.')}render('chat')}}}
else if(a.startsWith('sendchat:')){let p=find(a.split(':')[1]),input=$('#chat-input'),message=input?input.value.trim():'';if(p&&message){let h=chatFor(p),reply;if(/prix|tarif|combien/i.test(message))reply=p.type.includes('Fournisseur')?'Mon tarif est de '+money(p.cost)+' par unité.':'Le prix actuel est de '+money(g.price)+' par unité.';else if(/stock|disponib/i.test(message))reply='Stock disponible : '+g.stock+' unité(s) sur '+g.storage+'.';else if(/livraison|commande/i.test(message)&&p.type.includes('Fournisseur'))reply=answerFor(p,'livraison');else if(/commission|revenu/i.test(message)&&p.type.includes('Relais'))reply=answerFor(p,'commission');else if(/modèle|model/i.test(message)&&p.type.includes('Fournisseur'))reply=answerFor(p,'modeles');else if(p.type.includes('Client'))reply='Merci pour ton message ! Le prix est de '+money(g.price)+' et ton besoin estimé est de '+p.need+' unité(s).';else if(p.type.includes('Relais'))reply='Bien reçu ! Notre réseau compte '+g.relays.length+' relais. Ta confiance est de '+p.trust+'/100.';else reply='Bien reçu ! Délai habituel : '+p.deliveryDays+' jour(s), tarif : '+money(p.cost)+' par unité.';h.push({from:'me',text:message,day:g.day},{from:'them',text:reply,day:g.day});p.last=message;render('chat')}}
else if(a.startsWith('msg:')){let p=find(a.split(':')[1]);if(p){g.openChat=p.id;render('chat')}}
else if(a.startsWith('supplier:')){render('suppliers')}
}
